<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowMoney — Interactive Mobile Demo</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slatebg: "#0f172a",
            card: "#1e293b",
            ink: "#f8fafc",
            mute: "#94a3b8",
            cyanA: "#38bdf8",
            purpleA: "#a855f7",
            emeraldA: "#10b981",
            amberA: "#f59e0b",
            pinkA: "#ec4899",
          },
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
        },
      },
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: Inter, system-ui, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .toast-in { animation: toastIn .28s ease-out; }
  </style>
</head>
<body class="bg-[#020617] min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    /* ——— Lucide-style inline icons (no extra deps) ——— */
    const Icon = ({ d, size = 20, stroke = 1.8, className = "", children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round"
        className={className}>{children || <path d={d} />}</svg>
    );
    const HomeI = (p) => <Icon {...p}><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></Icon>;
    const LayoutI = (p) => <Icon {...p}><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></Icon>;
    const PieI = (p) => <Icon {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></Icon>;
    const CrownI = (p) => <Icon {...p}><path d="M2 18h20l-2-10-5 4-3-7-3 7-5-4z"/><path d="M6 18v2h12v-2"/></Icon>;
    const CogI = (p) => <Icon {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></Icon>;
    const SearchI = (p) => <Icon {...p}><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></Icon>;
    const PlusI = (p) => <Icon {...p}><path d="M12 5v14M5 12h14"/></Icon>;
    const ChevronL = (p) => <Icon {...p}><path d="m15 18-6-6 6-6"/></Icon>;
    const ChevronR = (p) => <Icon {...p}><path d="m9 18 6-6-6-6"/></Icon>;
    const Utensils = (p) => <Icon {...p}><path d="M3 2v7c0 1.1.9 2 2 2h0a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z"/><path d="M21 15v7"/></Icon>;
    const CarI = (p) => <Icon {...p}><path d="M5 17h14v-5l-2-5H7L5 12z"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M5 12h14"/></Icon>;
    const BagI = (p) => <Icon {...p}><path d="M6 8h12l1 13H5L6 8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></Icon>;
    const BillI = (p) => <Icon {...p}><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></Icon>;
    const LeafI = (p) => <Icon {...p}><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 6-2 10-6 12"/><path d="M11 20c-2-3 0-7 3-9"/></Icon>;
    const FilmI = (p) => <Icon {...p}><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4"/></Icon>;
    const SignalI = (p) => <Icon {...p} size={13} stroke={2}><path d="M6 16v2M10 13v5M14 10v8M18 7v11"/></Icon>;
    const WifiI = (p) => <Icon {...p} size={13} stroke={2}><path d="M5 12.5a9 9 0 0 1 14 0"/><path d="M8.5 15.2a5 5 0 0 1 7 0"/><path d="M12 18.2h.01"/></Icon>;
    const BatteryI = (p) => <Icon {...p} size={16} stroke={2}><rect x="2" y="7" width="16" height="10" rx="2"/><path d="M20 10v4"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/></Icon>;
    const GiftI = (p) => <Icon {...p}><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8c-2-4-6-3-6 0 0 2 3 3 6 0z"/><path d="M12 8c2-4 6-3 6 0 0 2-3 3-6 0z"/></Icon>;
    const PlayI = (p) => <Icon {...p}><polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/></Icon>;
    const CheckI = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5"/></Icon>;
    const BanI = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><path d="m5 5 14 14"/></Icon>;
    const CloudI = (p) => <Icon {...p}><path d="M17.5 19H7a5 5 0 0 1-.4-10 7 7 0 0 1 13.3 2A4 4 0 0 1 17.5 19z"/></Icon>;
    const ScanI = (p) => <Icon {...p}><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 12h8"/></Icon>;
    const PaletteI = (p) => <Icon {...p}><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12" r="1"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.04-.23-.29-.38-.65-.38-1.06a1.5 1.5 0 0 1 1.5-1.5H16c3.31 0 6-2.69 6-6 0-5.5-4.5-10-10-10z"/></Icon>;
    const UserI = (p) => <Icon {...p}><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></Icon>;
    const BankI = (p) => <Icon {...p}><path d="M3 10 12 4l9 6"/><path d="M5 10v8h14v-8"/><path d="M3 18h18"/><path d="M9 14v4M15 14v4"/></Icon>;
    const TagI = (p) => <Icon {...p}><path d="M20.6 13.4 12 22l-9-9 8.6-8.6a2 2 0 0 1 1.4-.4H20v7a2 2 0 0 1-.4 1.4z"/><circle cx="16" cy="8" r="1.2"/></Icon>;
    const HardDrive = (p) => <Icon {...p}><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 12h18"/><path d="M7 16h.01M11 16h2"/></Icon>;
    const FaceI = (p) => <Icon {...p}><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/><path d="M9 15c.8 1 1.8 1.5 3 1.5s2.2-.5 3-1.5"/></Icon>;
    const BellI = (p) => <Icon {...p}><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></Icon>;
    const LogOutI = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></Icon>;
    const FileI = (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></Icon>;
    const SheetI = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></Icon>;
    const SparkI = (p) => <Icon {...p}><path d="M12 3v4M12 17v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M3 12h4M17 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></Icon>;

    const ACCENT = {
      home: "#38bdf8",
      templates: "#a855f7",
      analytics: "#10b981",
      vip: "#f59e0b",
      settings: "#ec4899",
    };

    const CATS = [
      { id: "food", label: "อาหาร", Icon: Utensils, color: "#fb7185" },
      { id: "travel", label: "เดินทาง", Icon: CarI, color: "#38bdf8" },
      { id: "shop", label: "ช้อปปิ้ง", Icon: BagI, color: "#a855f7" },
      { id: "bill", label: "บิล", Icon: BillI, color: "#f59e0b" },
      { id: "fresh", label: "ของสด", Icon: LeafI, color: "#34d399" },
      { id: "fun", label: "บันเทิง", Icon: FilmI, color: "#f472b6" },
    ];

    const TX = [
      { id: 1, name: "เงินเดือนพาร์ทไทม์", cat: "รายรับ", amount: 3500, type: "in", time: "08:12" },
      { id: 2, name: "ค่ากาแฟลาเต้", cat: "อาหาร", amount: -65, type: "out", time: "09:40" },
      { id: 3, name: "BTS ไปสยาม", cat: "เดินทาง", amount: -47, type: "out", time: "10:05" },
    ];

    const TEMPLATES = [
      { id: 1, title: "ธีมนักศึกษา", sub: "Student Pocket", price: "FREE", tag: "free", accent: "from-cyan-400 to-sky-600" },
      { id: 2, title: "มนุษย์เงินเดือน", sub: "50 / 30 / 20 Rule", price: "฿39", tag: "paid", accent: "from-violet-400 to-purple-700" },
      { id: 3, title: "ทริปญี่ปุ่น 5D4N", sub: "เที่ยวคิวชู + โตเกียว", price: "฿59", tag: "paid", accent: "from-rose-400 to-orange-600" },
      { id: 4, title: "แม่ค้าออนไลน์ SME", sub: "แยกทุน-กำไร-ภาษี", price: "฿79", tag: "creator", accent: "from-emerald-400 to-teal-700" },
      { id: 5, title: "Minimal Pastel", sub: "Creator Collab", price: "VIP Free", tag: "vip", accent: "from-pink-300 to-fuchsia-600" },
    ];

    const FILTERS = [
      { id: "all", label: "ทั้งหมด" },
      { id: "free", label: "ธีมฟรี" },
      { id: "hot", label: "ยอดนิยม" },
      { id: "creator", label: "ฝากขาย Creator" },
    ];

    const VIP_PERKS = [
      { Icon: BanI, text: "ปิดโฆษณา 100%" },
      { Icon: LayoutI, text: "ปลดล็อกทุกเทมเพลตฟรี" },
      { Icon: CloudI, text: "ซิงก์คลาวด์เรียลไทม์" },
      { Icon: ScanI, text: "AI สแกนสลิปไม่จำกัด" },
      { Icon: PaletteI, text: "ได้ธีมนักวาดก่อนใคร" },
    ];

    function Toggle({ on, onChange, color = "#ec4899" }) {
      return (
        <button
          onClick={() => onChange(!on)}
          className="relative w-11 h-6 rounded-full transition-colors shrink-0"
          style={{ background: on ? color : "#334155" }}
        >
          <span className={`absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform ${on ? "translate-x-[22px]" : "translate-x-0.5"}`} />
        </button>
      );
    }

    function StatusBar() {
      return (
        <div className="flex items-center justify-between px-6 pt-2 pb-1 text-[11px] font-semibold text-ink">
          <span className="w-14">09:41</span>
          <div className="absolute left-1/2 -translate-x-1/2 top-2 w-[92px] h-[26px] bg-black rounded-full" />
          <div className="flex items-center gap-1.5 text-ink">
            <SignalI />
            <WifiI />
            <BatteryI />
          </div>
        </div>
      );
    }

    function HomeScreen({ toast }) {
      const [cat, setCat] = useState("food");
      const [note, setNote] = useState("ค่ากาแฟ");
      const [amt, setAmt] = useState("65.00");
      return (
        <div className="px-4 pb-4 space-y-3">
          <div>
            <p className="text-[11px] text-mute tracking-wide">ยอดเงินสุทธิรวม</p>
            <p className="text-[28px] font-extrabold text-ink leading-tight tracking-tight">฿24,850.00</p>
            <div className="flex gap-2 mt-2">
              <span className="text-[10px] px-2 py-1 rounded-full bg-white/5 text-mute">เงินสด ฿1,250</span>
              <span className="text-[10px] px-2 py-1 rounded-full bg-white/5 text-mute">ธนาคาร ฿23,600</span>
            </div>
          </div>

          <div className="rounded-2xl bg-card border border-white/5 p-3 space-y-2">
            <div className="flex items-center justify-between">
              <p className="text-xs font-semibold text-ink">บันทึกด่วน</p>
              <span className="text-[10px] text-cyanA">วันนี้ · 6 ก.ย.</span>
            </div>
            <div className="flex gap-2">
              <input
                value={note}
                onChange={(e) => setNote(e.target.value)}
                className="flex-1 bg-[#0f172a] rounded-xl px-3 py-2 text-sm text-ink outline-none border border-white/5"
                placeholder="ชื่อรายการ"
              />
              <input
                value={amt}
                onChange={(e) => setAmt(e.target.value)}
                className="w-[88px] bg-[#0f172a] rounded-xl px-3 py-2 text-sm text-ink outline-none border border-white/5 text-right"
                placeholder="0.00"
              />
            </div>
            <button
              onClick={() => toast(`บันทึกแล้ว · ${note} ฿${amt}`)}
              className="w-full h-10 rounded-xl bg-cyanA text-[#0f172a] text-sm font-bold flex items-center justify-center gap-1.5 active:scale-[0.98] transition"
            >
              <PlusI size={16} /> เพิ่มรายจ่าย
            </button>
          </div>

          <div className="grid grid-cols-3 gap-2">
            {CATS.map((c) => {
              const active = cat === c.id;
              return (
                <button
                  key={c.id}
                  onClick={() => setCat(c.id)}
                  className={`rounded-2xl py-3 flex flex-col items-center gap-1.5 border transition ${
                    active ? "border-white/20 bg-white/10" : "border-white/5 bg-card"
                  }`}
                >
                  <span className="w-9 h-9 rounded-xl flex items-center justify-center" style={{ background: c.color + "22", color: c.color }}>
                    <c.Icon size={18} />
                  </span>
                  <span className="text-[11px] text-ink">{c.label}</span>
                </button>
              );
            })}
          </div>

          <div>
            <p className="text-xs font-semibold text-ink mb-2">รายการวันนี้</p>
            <div className="space-y-1.5">
              {TX.map((t) => (
                <div key={t.id} className="flex items-center gap-3 bg-card rounded-xl px-3 py-2.5 border border-white/5">
                  <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold ${t.type === "in" ? "bg-emerald-500/15 text-emerald-400" : "bg-rose-500/15 text-rose-400"}`}>
                    {t.type === "in" ? "+" : "−"}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm text-ink truncate">{t.name}</p>
                    <p className="text-[10px] text-mute">{t.cat} · {t.time}</p>
                  </div>
                  <p className={`text-sm font-semibold ${t.type === "in" ? "text-emerald-400" : "text-rose-400"}`}>
                    {t.amount > 0 ? "+" : ""}{t.amount.toLocaleString("th-TH")}
                  </p>
                </div>
              ))}
            </div>
          </div>

          <div className="rounded-xl overflow-hidden border border-cyan-400/20 bg-gradient-to-r from-cyan-500/15 to-blue-600/10 px-3 py-2.5 flex items-center gap-3">
            <div className="w-8 h-8 rounded-lg bg-cyanA/20 text-cyanA flex items-center justify-center shrink-0">
              <SparkI size={16} />
            </div>
            <div className="flex-1 min-w-0">
              <p className="text-[11px] font-semibold text-ink leading-tight">บัตรเครดิต Cashback 5%</p>
              <p className="text-[10px] text-mute truncate">สมัครวันนี้ · ไม่มีค่าธรรมเนียมปีแรก</p>
            </div>
            <button onClick={() => toast("เปิดโปรโมชันบัตรเครดิต")} className="text-[10px] font-bold text-cyanA shrink-0">ดูเพิ่ม</button>
          </div>
        </div>
      );
    }

    function TemplatesScreen({ toast }) {
      const [q, setQ] = useState("");
      const [filter, setFilter] = useState("all");
      const [unlocked, setUnlocked] = useState(false);

      const list = useMemo(() => {
        return TEMPLATES.filter((t) => {
          const matchQ = !q || (t.title + t.sub).toLowerCase().includes(q.toLowerCase());
          if (!matchQ) return false;
          if (filter === "free") return t.tag === "free";
          if (filter === "creator") return t.tag === "creator";
          if (filter === "hot") return t.tag === "paid" || t.tag === "vip";
          return true;
        });
      }, [q, filter]);

      return (
        <div className="px-4 pb-4 space-y-3">
          <div>
            <p className="text-lg font-bold text-ink">คลังเทมเพลต</p>
            <p className="text-[11px] text-mute">เลือกธีมงบที่เหมาะกับไลฟ์สไตล์</p>
          </div>

          <div className="flex items-center gap-2 bg-card border border-white/5 rounded-xl px-3 h-10">
            <SearchI size={16} className="text-mute" />
            <input
              value={q}
              onChange={(e) => setQ(e.target.value)}
              placeholder="ค้นหาเทมเพลต..."
              className="flex-1 bg-transparent text-sm text-ink outline-none placeholder:text-mute"
            />
          </div>

          <div className="rounded-2xl p-3 bg-gradient-to-br from-purple-500/20 to-fuchsia-600/10 border border-purple-400/20">
            <div className="flex gap-2 items-start">
              <GiftI size={18} className="text-purple-300 mt-0.5" />
              <div className="flex-1">
                <p className="text-[12px] font-semibold text-ink leading-snug">ดูวิดีโอโฆษณา 1 ครั้ง → ปลดล็อกธีมพรีเมียมฟรี 24 ชม.</p>
              </div>
            </div>
            <button
              onClick={() => { setUnlocked(true); toast("ปลดล็อกธีมพรีเมียม 24 ชม."); }}
              className="mt-2 w-full h-9 rounded-xl bg-purpleA text-white text-xs font-bold flex items-center justify-center gap-1.5 active:scale-[0.98]"
            >
              <PlayI size={12} /> {unlocked ? "ปลดล็อกแล้ว ✓" : "ดูคลิป"}
            </button>
          </div>

          <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
            {FILTERS.map((f) => (
              <button
                key={f.id}
                onClick={() => setFilter(f.id)}
                className={`shrink-0 px-3 h-7 rounded-full text-[11px] font-medium border ${
                  filter === f.id ? "bg-purpleA text-white border-purpleA" : "bg-card text-mute border-white/5"
                }`}
              >
                {f.label}
              </button>
            ))}
          </div>

          <div className="space-y-2">
            {list.map((t) => (
              <div key={t.id} className="rounded-2xl overflow-hidden border border-white/5 bg-card flex">
                <div className={`w-1.5 bg-gradient-to-b ${t.accent}`} />
                <div className="flex-1 p-3 flex items-center gap-3">
                  <div className={`w-11 h-11 rounded-xl bg-gradient-to-br ${t.accent} opacity-90`} />
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold text-ink">{t.title}</p>
                    <p className="text-[11px] text-mute">{t.sub}</p>
                  </div>
                  <button
                    onClick={() => toast(t.tag === "free" || t.tag === "vip" ? `ใช้ธีม ${t.title}` : `ซื้อ ${t.title} ${t.price}`)}
                    className={`shrink-0 px-2.5 h-7 rounded-lg text-[11px] font-bold ${
                      t.tag === "free" ? "bg-emerald-500/15 text-emerald-400" :
                      t.tag === "vip" ? "bg-amber-500/15 text-amber-400" :
                      "bg-purpleA text-white"
                    }`}
                  >
                    {t.tag === "free" ? "ใช้ฟรี" : t.price}
                  </button>
                </div>
              </div>
            ))}
            {list.length === 0 && <p className="text-center text-xs text-mute py-6">ไม่พบเทมเพลต</p>}
          </div>
        </div>
      );
    }

    function AnalyticsScreen({ toast }) {
      const months = ["สิงหาคม 2026", "กันยายน 2026", "ตุลาคม 2026"];
      const [mi, setMi] = useState(1);
      const segs = [
        { label: "อาหาร", pct: 40, color: "#fb7185" },
        { label: "เดินทาง", pct: 25, color: "#38bdf8" },
        { label: "ช้อปปิ้ง", pct: 20, color: "#a855f7" },
        { label: "บิล", pct: 15, color: "#f59e0b" },
      ];
      // donut via conic-gradient
      const conic = `conic-gradient(${segs[0].color} 0% 40%, ${segs[1].color} 40% 65%, ${segs[2].color} 65% 85%, ${segs[3].color} 85% 100%)`;

      return (
        <div className="px-4 pb-4 space-y-3">
          <div className="flex items-center justify-between">
            <button onClick={() => setMi((v) => Math.max(0, v - 1))} className="w-8 h-8 rounded-full bg-card border border-white/5 flex items-center justify-center text-ink">
              <ChevronL size={16} />
            </button>
            <p className="text-sm font-semibold text-ink">{months[mi]}</p>
            <button onClick={() => setMi((v) => Math.min(2, v + 1))} className="w-8 h-8 rounded-full bg-card border border-white/5 flex items-center justify-center text-ink">
              <ChevronR size={16} />
            </button>
          </div>

          <div className="bg-card border border-white/5 rounded-2xl p-4 flex flex-col items-center">
            <div className="relative w-36 h-36 rounded-full" style={{ background: conic }}>
              <div className="absolute inset-5 rounded-full bg-card flex flex-col items-center justify-center">
                <p className="text-[10px] text-mute">ใช้ไปแล้ว</p>
                <p className="text-lg font-extrabold text-ink">฿18,420</p>
              </div>
            </div>
            <p className="text-[11px] text-mute mt-3">สัดส่วนค่าใช้จ่ายเดือนนี้</p>
          </div>

          <div className="space-y-2">
            {segs.map((s) => (
              <div key={s.label} className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full" style={{ background: s.color }} />
                <p className="flex-1 text-xs text-ink">{s.label}</p>
                <div className="w-24 h-1.5 rounded-full bg-white/10 overflow-hidden">
                  <div className="h-full rounded-full" style={{ width: s.pct + "%", background: s.color }} />
                </div>
                <p className="w-8 text-right text-xs font-semibold text-mute">{s.pct}%</p>
              </div>
            ))}
          </div>

          <div className="bg-card border border-rose-500/20 rounded-2xl p-3">
            <div className="flex items-center justify-between mb-1.5">
              <p className="text-xs font-semibold text-ink">งบประมาณเดือนนี้</p>
              <p className="text-xs font-bold text-rose-400">82%</p>
            </div>
            <div className="h-2 rounded-full bg-white/10 overflow-hidden">
              <div className="h-full w-[82%] rounded-full bg-gradient-to-r from-amber-400 to-rose-500" />
            </div>
            <p className="text-[11px] text-rose-300 mt-2">⚠️ เกิน 80% แล้ว · เหลือ ฿4,030 จาก ฿22,450</p>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => toast("กำลังส่งออก Excel...")} className="h-10 rounded-xl bg-card border border-white/10 text-xs font-semibold text-ink flex items-center justify-center gap-1.5">
              <SheetI size={14} className="text-emeraldA" /> Excel
            </button>
            <button onClick={() => toast("กำลังส่งออก PDF...")} className="h-10 rounded-xl bg-card border border-white/10 text-xs font-semibold text-ink flex items-center justify-center gap-1.5">
              <FileI size={14} className="text-emeraldA" /> PDF
            </button>
          </div>
        </div>
      );
    }

    function VipScreen({ toast }) {
      const [plan, setPlan] = useState("year");
      return (
        <div className="px-4 pb-4 space-y-3">
          <div className="rounded-2xl p-4 bg-gradient-to-br from-amber-300 via-yellow-500 to-amber-700 text-[#1c1200] shadow-[0_8px_30px_rgba(245,158,11,0.25)]">
            <div className="flex items-center gap-2">
              <CrownI size={22} />
              <p className="text-sm font-extrabold tracking-wide">FLOWMONEY VIP</p>
            </div>
            <p className="text-[11px] mt-1 opacity-80">สมาชิกคลับพรีเมียม · สิทธิพิเศษครบวงจร</p>
          </div>

          <div className="bg-card border border-white/5 rounded-2xl p-3 space-y-2.5">
            <p className="text-xs font-semibold text-ink">สิทธิประโยชน์ 5 ข้อ</p>
            {VIP_PERKS.map((p, i) => (
              <div key={i} className="flex items-center gap-2.5">
                <span className="w-7 h-7 rounded-lg bg-amber-500/15 text-amberA flex items-center justify-center">
                  <p.Icon size={14} />
                </span>
                <p className="text-xs text-ink flex-1">{p.text}</p>
                <CheckI size={14} className="text-amberA" />
              </div>
            ))}
          </div>

          <div className="grid grid-cols-2 gap-2">
            <button
              onClick={() => setPlan("month")}
              className={`rounded-2xl p-3 text-left border ${plan === "month" ? "border-amberA bg-amber-500/10" : "border-white/5 bg-card"}`}
            >
              <p className="text-[10px] text-mute">รายเดือน</p>
              <p className="text-lg font-extrabold text-ink">฿49</p>
              <p className="text-[10px] text-mute">/ เดือน</p>
            </button>
            <button
              onClick={() => setPlan("year")}
              className={`rounded-2xl p-3 text-left border relative ${plan === "year" ? "border-amberA bg-amber-500/10" : "border-white/5 bg-card"}`}
            >
              <span className="absolute -top-2 right-2 text-[9px] font-bold bg-orange-500 text-white px-1.5 py-0.5 rounded-full">ประหยัด 32%</span>
              <p className="text-[10px] text-mute">รายปี</p>
              <p className="text-lg font-extrabold text-ink">฿399</p>
              <p className="text-[10px] text-mute">/ ปี</p>
            </button>
          </div>

          <button
            onClick={() => toast("เริ่มทดลองใช้ฟรี 7 วัน · แพ็กเกจ " + (plan === "year" ? "รายปี" : "รายเดือน"))}
            className="w-full h-12 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 text-[#1c1200] text-sm font-extrabold active:scale-[0.98] transition"
          >
            ทดลองใช้งานฟรี 7 วัน
          </button>
          <p className="text-center text-[10px] text-mute">ยกเลิกได้ทุกเมื่อ · ไม่คิดเงินจนกว่าจะครบ 7 วัน</p>
        </div>
      );
    }

    function SettingsScreen({ toast }) {
      const [face, setFace] = useState(true);
      const [remind, setRemind] = useState(true);
      return (
        <div className="px-4 pb-4 space-y-3">
          <div className="bg-card border border-white/5 rounded-2xl p-3 flex items-center gap-3">
            <div className="w-12 h-12 rounded-full bg-gradient-to-br from-pink-400 to-fuchsia-600 flex items-center justify-center text-white">
              <UserI size={22} />
            </div>
            <div className="flex-1">
              <p className="text-sm font-bold text-ink">คุณมิ้นต์ Flow</p>
              <p className="text-[11px] text-mute">mint@flowmoney.app</p>
            </div>
            <span className="text-[10px] font-semibold px-2 py-1 rounded-full bg-white/5 text-mute border border-white/10">Free Member</span>
          </div>

          <div>
            <p className="text-[11px] text-mute mb-1.5 px-1">จัดการข้อมูล & กระเป๋าเงิน</p>
            <div className="bg-card border border-white/5 rounded-2xl overflow-hidden divide-y divide-white/5">
              {[
                { Icon: BankI, label: "จัดการบัญชีธนาคาร" },
                { Icon: TagI, label: "ปรับแต่งหมวดหมู่" },
                { Icon: HardDrive, label: "สำรองข้อมูล iCloud / Drive" },
              ].map((row) => (
                <button key={row.label} onClick={() => toast(row.label)} className="w-full flex items-center gap-3 px-3 py-3 text-left">
                  <row.Icon size={16} className="text-pinkA" />
                  <span className="flex-1 text-sm text-ink">{row.label}</span>
                  <ChevronR size={14} className="text-mute" />
                </button>
              ))}
            </div>
          </div>

          <div>
            <p className="text-[11px] text-mute mb-1.5 px-1">ความปลอดภัย & การแจ้งเตือน</p>
            <div className="bg-card border border-white/5 rounded-2xl overflow-hidden divide-y divide-white/5">
              <div className="flex items-center gap-3 px-3 py-3">
                <FaceI size={16} className="text-pinkA" />
                <span className="flex-1 text-sm text-ink">Face ID / PIN Lock</span>
                <Toggle on={face} onChange={setFace} />
              </div>
              <div className="flex items-center gap-3 px-3 py-3">
                <BellI size={16} className="text-pinkA" />
                <div className="flex-1">
                  <p className="text-sm text-ink">แจ้งเตือนบันทึกประจำวัน</p>
                  <p className="text-[10px] text-mute">ทุกวัน 20:00 น.</p>
                </div>
                <Toggle on={remind} onChange={setRemind} />
              </div>
            </div>
          </div>

          <button
            onClick={() => toast("ออกจากระบบแล้ว")}
            className="w-full h-11 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm font-semibold flex items-center justify-center gap-2"
          >
            <LogOutI size={16} /> ออกจากระบบ
          </button>
        </div>
      );
    }

    const TABS = [
      { id: "home", label: "หน้าแรก", Icon: HomeI, color: ACCENT.home },
      { id: "templates", label: "เทมเพลต", Icon: LayoutI, color: ACCENT.templates },
      { id: "analytics", label: "วิเคราะห์", Icon: PieI, color: ACCENT.analytics },
      { id: "vip", label: "VIP", Icon: CrownI, color: ACCENT.vip },
      { id: "settings", label: "ตั้งค่า", Icon: CogI, color: ACCENT.settings },
    ];

    function App() {
      const [tab, setTab] = useState("home");
      const [toastMsg, setToastMsg] = useState(null);

      const toast = (msg) => {
        setToastMsg(msg);
        clearTimeout(window.__fmToast);
        window.__fmToast = setTimeout(() => setToastMsg(null), 1800);
      };

      const accent = ACCENT[tab];

      return (
        <div className="min-h-screen w-full flex items-center justify-center p-4 md:p-8 bg-[radial-gradient(ellipse_at_top,#1e293b,transparent_55%),#020617]">
          <div className="w-full max-w-[420px] flex flex-col items-center gap-4">
            <div className="text-center">
              <p className="text-ink font-extrabold tracking-tight text-xl">FlowMoney</p>
              <p className="text-mute text-xs">Interactive Mobile Demo · คลิกแท็บด้านล่างได้จริง</p>
            </div>

            <div className="relative">
              <div className="absolute -inset-3 rounded-[48px] bg-gradient-to-b from-white/10 to-white/0 pointer-events-none" />
              <div
                className="relative w-[340px] h-[700px] rounded-[44px] bg-black p-[10px] shadow-[0_30px_80px_rgba(0,0,0,0.55)]"
                style={{ boxShadow: `0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08), 0 0 40px ${accent}22` }}
              >
                <div className="w-full h-full rounded-[34px] overflow-hidden bg-slatebg flex flex-col relative">
                  <StatusBar />

                  <div className="flex-1 overflow-y-auto no-scrollbar pt-2">
                    {tab === "home" && <HomeScreen toast={toast} />}
                    {tab === "templates" && <TemplatesScreen toast={toast} />}
                    {tab === "analytics" && <AnalyticsScreen toast={toast} />}
                    {tab === "vip" && <VipScreen toast={toast} />}
                    {tab === "settings" && <SettingsScreen toast={toast} />}
                  </div>

                  {toastMsg && (
                    <div className="absolute left-3 right-3 bottom-[76px] toast-in">
                      <div className="rounded-xl bg-[#0b1220]/95 border border-white/10 text-ink text-xs px-3 py-2 text-center shadow-lg backdrop-blur">
                        {toastMsg}
                      </div>
                    </div>
                  )}

                  <div className="border-t border-white/5 bg-[#0b1220]/90 backdrop-blur px-1 pt-1.5 pb-3">
                    <div className="flex">
                      {TABS.map((t) => {
                        const on = tab === t.id;
                        return (
                          <button
                            key={t.id}
                            onClick={() => setTab(t.id)}
                            className="flex-1 flex flex-col items-center gap-0.5 py-1"
                          >
                            <t.Icon size={20} className="transition-colors" style={{ color: on ? t.color : "#64748b" }} />
                            <span className="text-[9px] font-medium" style={{ color: on ? t.color : "#64748b" }}>{t.label}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <p className="text-[11px] text-slate-500 text-center max-w-sm">
              Dark premium mockup · React + Tailwind · สี accent ตามแท็บ · บันทึกด่วน / ฟิลเตอร์ / สวิตช์ / แพ็กเกจ VIP ใช้งานได้
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
